<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c0b"/>
      <stop offset="50%" stop-color="#0b1716"/>
      <stop offset="100%" stop-color="#050a09"/>
    </linearGradient>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyberGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgCyber)"/>

  <!-- Radar Concentric Circles -->
  <g stroke="#10b981" stroke-opacity="0.12" fill="none">
    <circle cx="600" cy="400" r="100"/>
    <circle cx="600" cy="400" r="180"/>
    <circle cx="600" cy="400" r="260"/>
    <circle cx="600" cy="400" r="340"/>
    <line x1="200" y1="400" x2="1000" y2="400"/>
    <line x1="600" y1="60" x2="600" y2="740"/>
  </g>

  <!-- Ambient Glow Center -->
  <circle cx="600" cy="400" r="180" fill="#10b981" opacity="0.08" filter="url(#cyberGlow)"/>

  <!-- Central Shield of Security -->
  <g transform="translate(600, 390)">
    <!-- Outer Shield Glow -->
    <path d="M0 -110 L90 -70 L90 20 Q90 90 0 130 Q-90 90 -90 20 L-90 -70 Z" fill="#0d1f1c" stroke="#10b981" stroke-width="3" filter="url(#cyberGlow)"/>
    <path d="M0 -95 L75 -60 L75 15 Q75 75 0 110 Q-75 75 -75 15 L-75 -60 Z" fill="#0f2421" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Keyhole / Security Icon -->
    <circle cx="0" cy="-10" r="18" fill="#10b981"/>
    <path d="M-8 0 L8 0 L12 36 L-12 36 Z" fill="#10b981"/>
  </g>

  <!-- Threat Radar Ping Targets -->
  <circle cx="780" cy="280" r="8" fill="#ef4444" filter="url(#cyberGlow)"/>
  <circle cx="780" cy="280" r="20" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="810" y="285" fill="#ef4444" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700">THREAT MITIGATED</text>

  <circle cx="440" cy="520" r="8" fill="#10b981" filter="url(#cyberGlow)"/>
  <circle cx="440" cy="520" r="20" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="470" y="525" fill="#10b981" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700">FIREWALL SECURE</text>

  <!-- Top Security Stats Bar -->
  <g transform="translate(200, 110)">
    <rect width="800" height="64" rx="14" fill="#0d1b19" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="35" y="38" fill="#888888" font-family="'Inter',sans-serif" font-size="12" font-weight="600">ZERO TRUST PERIMETER</text>
    <circle cx="210" cy="33" r="5" fill="#10b981"/>
    
    <text x="310" y="38" fill="#888888" font-family="'Inter',sans-serif" font-size="12" font-weight="600">COMMUNITY PORTAL</text>
    <text x="450" y="38" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="14" font-weight="700">LIVE MONITORING</text>
    <text x="640" y="38" fill="#06b6d4" font-family="'DM Sans',sans-serif" font-size="13" font-weight="700">100% ENCRYPTED</text>
  </g>

  <!-- Bottom Terminal / Checklist Preview -->
  <g transform="translate(220, 600)">
    <rect width="760" height="90" rx="14" fill="#0a1614" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="30" y="35" fill="#888888" font-family="'JetBrains Mono',monospace" font-size="12">$ secure-audit --verify-safety-protocols</text>
    <text x="30" y="62" fill="#10b981" font-family="'JetBrains Mono',monospace" font-size="12">[SUCCESS] Awareness &amp; Prevention Protocols Synchronized (All Endpoints Protected)</text>
  </g>
</svg>