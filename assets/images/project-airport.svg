<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAirport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="airGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgAirport)"/>

  <!-- Radar Arc Grid in Top Right -->
  <g stroke="#38bdf8" stroke-opacity="0.1" fill="none">
    <circle cx="1000" cy="150" r="100"/>
    <circle cx="1000" cy="150" r="180"/>
    <circle cx="1000" cy="150" r="260"/>
    <circle cx="1000" cy="150" r="340"/>
    <!-- Flight Path Trajectory Line -->
    <path d="M 120 700 Q 500 500, 850 300 T 1100 120" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,6" filter="url(#airGlow)"/>
  </g>

  <!-- Airplane Vector Silhouette -->
  <g transform="translate(850, 300) rotate(-35) scale(0.9)">
    <path d="M0 -30 L8 -10 L30 -2 L8 4 L6 20 L16 28 L14 32 L0 26 L-14 32 L-16 28 L-6 20 L-8 4 L-30 -2 L-8 -10 Z" fill="#ffffff" filter="url(#airGlow)"/>
  </g>

  <!-- Dashboard Cards Container -->
  <!-- Header Bar -->
  <g transform="translate(140, 90)">
    <rect width="920" height="60" rx="14" fill="#111827" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="35" cy="30" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M30 30 L40 30 M35 25 L35 35" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="36" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="16" font-weight="800">AIRPORT AUTHORITY OF INDIA · FLIGHT INTELLIGENCE DASHBOARD</text>
    <rect x="780" y="16" width="110" height="28" rx="14" fill="#10b981" fill-opacity="0.15"/>
    <text x="835" y="35" fill="#10b981" font-family="'DM Sans',sans-serif" font-size="11" font-weight="700" text-anchor="middle">LIVE TELEMETRY</text>
  </g>

  <!-- Metric 1: Total Flights -->
  <g transform="translate(140, 180)">
    <rect width="280" height="110" rx="14" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="36" fill="#888888" font-family="'Inter',sans-serif" font-size="12" font-weight="600">MONTHLY TRAFFIC</text>
    <text x="24" y="80" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="34" font-weight="800">2.4M</text>
    <text x="135" y="78" fill="#10b981" font-family="'DM Sans',sans-serif" font-size="14" font-weight="700">+14.2%</text>
  </g>

  <!-- Metric 2: On-Time Departure -->
  <g transform="translate(460, 180)">
    <rect width="280" height="110" rx="14" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="36" fill="#888888" font-family="'Inter',sans-serif" font-size="12" font-weight="600">ON-TIME DEPARTURES</text>
    <text x="24" y="80" fill="#38bdf8" font-family="'DM Sans',sans-serif" font-size="34" font-weight="800">94.8%</text>
    <text x="145" y="78" fill="#888888" font-family="'DM Sans',sans-serif" font-size="13">TARGET 92%</text>
  </g>

  <!-- Metric 3: Gate Turnaround -->
  <g transform="translate(780, 180)">
    <rect width="280" height="110" rx="14" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="36" fill="#888888" font-family="'Inter',sans-serif" font-size="12" font-weight="600">AVG TURNAROUND</text>
    <text x="24" y="80" fill="#f59e0b" font-family="'DM Sans',sans-serif" font-size="34" font-weight="800">32 MIN</text>
    <text x="160" y="78" fill="#10b981" font-family="'DM Sans',sans-serif" font-size="13">-4 MIN</text>
  </g>

  <!-- Big Interactive Bar Chart for Flight Density -->
  <g transform="translate(140, 320)">
    <rect width="920" height="360" rx="16" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="35" y="45" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="16" font-weight="700">HOURLY RUNWAY CAPACITY &amp; PASSENGER DENSITY</text>

    <!-- Bars -->
    <!-- Bar 1 -->
    <rect x="80" y="180" width="45" height="130" rx="6" fill="url(#barGrad)"/>
    <text x="102" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">06:00</text>
    <!-- Bar 2 -->
    <rect x="160" y="120" width="45" height="190" rx="6" fill="url(#barGrad)"/>
    <text x="182" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">08:00</text>
    <!-- Bar 3 (Peak) -->
    <rect x="240" y="80" width="45" height="230" rx="6" fill="#38bdf8" filter="url(#airGlow)"/>
    <text x="262" y="330" fill="#ffffff" font-family="'Inter',sans-serif" font-size="11" font-weight="700" text-anchor="middle">10:00</text>
    <!-- Bar 4 -->
    <rect x="320" y="150" width="45" height="160" rx="6" fill="url(#barGrad)"/>
    <text x="342" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">12:00</text>
    <!-- Bar 5 -->
    <rect x="400" y="190" width="45" height="120" rx="6" fill="url(#barGrad)"/>
    <text x="422" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">14:00</text>
    <!-- Bar 6 -->
    <rect x="480" y="100" width="45" height="210" rx="6" fill="url(#barGrad)"/>
    <text x="502" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">16:00</text>
    <!-- Bar 7 (Peak) -->
    <rect x="560" y="70" width="45" height="240" rx="6" fill="#38bdf8" filter="url(#airGlow)"/>
    <text x="582" y="330" fill="#ffffff" font-family="'Inter',sans-serif" font-size="11" font-weight="700" text-anchor="middle">18:00</text>
    <!-- Bar 8 -->
    <rect x="640" y="130" width="45" height="180" rx="6" fill="url(#barGrad)"/>
    <text x="662" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">20:00</text>
    <!-- Bar 9 -->
    <rect x="720" y="210" width="45" height="100" rx="6" fill="url(#barGrad)"/>
    <text x="742" y="330" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">22:00</text>

    <!-- Side Mini Doughnut Chart -->
    <g transform="translate(830, 180)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#1d4ed8" stroke-width="14"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="220 314" filter="url(#airGlow)"/>
      <text x="0" y="6" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="16" font-weight="800" text-anchor="middle">92%</text>
      <text x="0" y="75" fill="#888888" font-family="'Inter',sans-serif" font-size="11" text-anchor="middle">PUNCTUALITY</text>
    </g>
  </g>
</svg>